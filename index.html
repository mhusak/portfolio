<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio with Burger Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button class="burger-menu" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="nav-menu">
    <a href="#cv">CV</a>
    <a href="#projects">Projects</a>
    <a href="#contacts">Contacts</a>
    <a href="#about">About</a>
  </nav>
  <div class="top-bar">
    <div class="top-bar-title">My Portfolio</div>
  </div>

  <section class="hero">
    <div class="hero-textbox">
      <h2>Welcome to my portfolio</h2>
      <p>Here you'll find info about me, my projects, and how to contact me.</p>
      <a href="#projects" class="hero-button">See Projects</a>
    </div>
  </section>

  <section class="section-links">
    <div class="container">
      <div id="cv" class="link-box"><a href="#cv">CV</a></div>
      <div id="projects" class="link-box"><a href="#projects">Projects</a></div>
      <div id="contacts" class="link-box"><a href="#contacts">Contacts</a></div>
      <div id="about" class="link-box"><a href="#about">About</a></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>

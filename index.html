<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This section contains meta information about the webpage -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The title appears in the browser tab -->
    <title>My First Website</title>
    
    <!-- Internal CSS to style your website -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: ##1c0bd6;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        section {
            margin-top: 2rem;
        }

        footer {
            margin-top: 4rem;
            text-align: center;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>
    <!-- The header section usually contains the website title and navigation -->
    <header>
        <h1>Welcome to My Website</h1>
        <p>This is my first GitHub Pages site!</p>
    </header>

    <!-- Main content area of your site -->
    <section>
        <h2>About Me</h2>
        <p>I’m learning how to build websites using GitHub Pages.</p>
    </section>

    <!-- Footer is usually at the bottom and contains copyright or contact info -->
    <footer>
        <p>&copy; 2025 Michael Husak</p>
    </footer>
</body>
</html>
